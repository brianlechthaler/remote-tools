name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tailscale-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tailscale startup test
        run: bash scripts/test-tailscale-startup.sh

  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run Kubernetes tests
        run: bash scripts/test-k8s.sh
        env:
          CLUSTER_PROVIDER: kind

  automerge:
    needs: [tailscale-startup, k8s-integration]
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
            exit 0
          fi
          pr="$(gh pr list --head "${{ github.ref_name }}" --label automerge --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr}" ]]; then
            echo "No open automerge pull request for branch ${{ github.ref_name }}."
            exit 0
          fi
          gh pr merge "${pr}" --squash --delete-branch
