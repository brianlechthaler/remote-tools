name: Bump Tailscale

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare current and latest Tailscale versions
        id: versions
        run: |
          CURRENT="$(bash scripts/tailscale-version.sh current)"
          LATEST="$(bash scripts/tailscale-version.sh latest)"
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          if [[ "${CURRENT}" == "${LATEST}" ]]; then
            echo "update_needed=false" >> "${GITHUB_OUTPUT}"
            echo "Already on latest Tailscale Docker image (${CURRENT})."
          else
            echo "update_needed=true" >> "${GITHUB_OUTPUT}"
            echo "Update available: ${CURRENT} -> ${LATEST}"
          fi

      - name: Update Dockerfile and image docs
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          sed -i "s|tailscale/tailscale:v[0-9.]*|tailscale/tailscale:${LATEST}|" Dockerfile
          sed -i "s|tailscale/tailscale:v[0-9.]*|tailscale/tailscale:${LATEST}|" docs/features/container-image.md

      - name: Create pull request
        id: pr
        if: steps.versions.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/tailscale-${{ steps.versions.outputs.latest }}
          title: Bump Tailscale to ${{ steps.versions.outputs.latest }}
          commit-message: Bump Tailscale to ${{ steps.versions.outputs.latest }}
          body: |
            Automated weekly bump to the latest stable Tailscale Docker image.

            - **Current:** ${{ steps.versions.outputs.current }}
            - **Latest:** ${{ steps.versions.outputs.latest }}

            This PR will be merged automatically after the Tailscale startup test passes.
          labels: automerge
          add-paths: |
            Dockerfile
            docs/features/container-image.md

      # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
      # workflow_dispatch is an allowed exception, so kick Test on the bump
      # branch; its automerge job squash-merges when the automerge label is set.
      - name: Run Test workflow on the bump branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run Test --ref "${{ steps.pr.outputs.pull-request-branch }}"
