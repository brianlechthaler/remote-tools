name: Test Kubernetes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kwokctl (fallback when kind cannot boot)
        run: |
          curl -fsSL -o /tmp/kwokctl \
            "https://github.com/kubernetes-sigs/kwok/releases/download/v0.6.1/kwokctl-linux-amd64"
          sudo install -m 0755 /tmp/kwokctl /usr/local/bin/kwokctl
          kwokctl --version

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run Kubernetes tests
        run: bash scripts/test-k8s.sh
        env:
          # Prefer kind on GitHub-hosted runners; fail closed if it cannot start.
          CLUSTER_PROVIDER: kind
