apiVersion: batch/v1
kind: CronJob
metadata:
  name: remote-tools-health
  namespace: remote-tools
  labels:
    app.kubernetes.io/name: remote-tools
    app.kubernetes.io/part-of: remote-tools
    app.kubernetes.io/component: health
spec:
  # Matches remote-tools-health.timer (every 5 minutes).
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: remote-tools
            app.kubernetes.io/component: health
        spec:
          serviceAccountName: remote-tools
          restartPolicy: Never
          containers:
            - name: healthcheck
              image: alpine:3.21
              imagePullPolicy: IfNotPresent
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: MAX_RESTARTS_PER_HOUR
                  valueFrom:
                    configMapKeyRef:
                      name: remote-tools-config
                      key: MAX_RESTARTS_PER_HOUR
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache bash curl ca-certificates >/dev/null
                  exec bash /scripts/k8s-healthcheck.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: stamp
                  mountPath: /var/lib/remote-tools
          volumes:
            - name: scripts
              configMap:
                name: remote-tools-scripts
                defaultMode: 0755
            - name: stamp
              emptyDir: {}
